---
# Live beobachtet: /home (eigenes ZFS-Dataset, getrennt vom Root-Dataset,
# damit es Boot-Environment-Rollbacks uebersteht) war beim allerersten
# Ansible-Task bereits NICHT gemountet - Ergebnis war kein Fehler,
# sondern ein STILLER Fallback: der Benutzer-Home-Ordner (2.4G, SSH-Key,
# Dotfiles, Configs - alles) wurde stattdessen unbemerkt direkt auf dem
# Root-Dataset angelegt, das separate Home-Dataset blieb leer. Die
# eigentliche Reparatur (per "zfs mount") passiert jetzt VOR diesem Lauf
# noch auf dem Live-System in scripts/00-disk-and-base-install.sh -
# NICHT hier, weil das Zielsystem an diesem fruehen Punkt noch gar kein
# zfs-utils installiert hat (kommt erst aus roles/packages) und "zfs
# mount" im chroot deshalb mit "No such file or directory" fehlschlaegt
# (live so gesehen, als dieser Task noch selbst zu reparieren versuchte).
# Hier nur noch eine letzte, harte Absicherung: wenn's trotzdem nicht
# gemountet ist, sofort klar abbrechen statt das Root-Dataset
# stillschweigend vollzuschreiben.
- name: Pruefen, ob /home korrekt als eigenes Dataset gemountet ist
  ansible.builtin.command: mountpoint -q /home
  register: _home_mountpoint_check
  failed_when: >-
    _home_mountpoint_check.rc != 0
  changed_when: false

- name: Hostname setzen
  ansible.builtin.copy:
    dest: /etc/hostname
    content: "{{ system_hostname }}\n"
    owner: root
    group: root
    mode: "0644"

- name: /etc/hosts
  ansible.builtin.copy:
    dest: /etc/hosts
    content: |
      127.0.0.1   localhost
      ::1         localhost
      127.0.1.1   {{ system_hostname }}.localdomain {{ system_hostname }}
    owner: root
    group: root
    mode: "0644"

- name: Zeitzone setzen
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ system_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Hardware-Uhr synchronisieren
  ansible.builtin.command: hwclock --systohc
  changed_when: false
  failed_when: false

- name: locale.gen - {{ system_locale }} aktivieren
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: "^#?{{ system_locale | regex_escape }} UTF-8"
    line: "{{ system_locale }} UTF-8"

- name: locale-gen ausfuehren
  ansible.builtin.command: locale-gen
  register: _locale_gen
  changed_when: "'done' in _locale_gen.stdout or _locale_gen.rc == 0"

- name: /etc/locale.conf
  ansible.builtin.copy:
    dest: /etc/locale.conf
    content: "LANG={{ system_locale }}\n"
    owner: root
    group: root
    mode: "0644"

- name: /etc/vconsole.conf (Konsolen-Keymap)
  ansible.builtin.copy:
    dest: /etc/vconsole.conf
    content: "KEYMAP={{ console_keymap }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Sekundaergruppen des Users vorab sicherstellen (Pakete, die sie sonst anlegen wuerden, kommen erst in roles/packages)
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ restore_user_groups }}"
  when: item != 'wheel'

- name: Benutzer {{ restore_user }} anlegen
  ansible.builtin.user:
    name: "{{ restore_user }}"
    uid: "{{ restore_user_uid }}"
    groups: "{{ restore_user_groups }}"
    append: true
    shell: /bin/bash
    create_home: true
    password: "{{ vault_user_password_hash | default(omit) }}"

- name: Root-Passwort setzen (falls in vault.yml hinterlegt)
  ansible.builtin.user:
    name: root
    password: "{{ vault_root_password_hash }}"
  when: vault_root_password_hash is defined and vault_root_password_hash | length > 0

- name: wheel darf sudo (Passwort erforderlich, kein NOPASSWD)
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: "^#?\\s*%wheel ALL=\\(ALL:ALL\\) ALL"
    line: "%wheel ALL=(ALL:ALL) ALL"
    validate: "visudo -cf %s"

- name: NetworkManager-Dienste aktivieren
  # NetworkManager selbst ist schon aus dem Minimalsystem (Stufe 0
  # pacstrap) da. zfs-*/bluetooth-Services dagegen erst NACH roles/packages
  # verfuegbar (zfs-utils/bluez werden dort installiert) - deren
  # Aktivierung steht deshalb am Ende von roles/packages, nicht hier.
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  loop:
    - NetworkManager.service
    - NetworkManager-dispatcher.service
    - NetworkManager-wait-online.service
