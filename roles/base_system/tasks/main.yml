---
# Live beobachtet: /home (eigenes ZFS-Dataset, getrennt vom Root-Dataset,
# damit es Boot-Environment-Rollbacks uebersteht) war beim allerersten
# Ansible-Task bereits NICHT gemountet - Ergebnis war kein Fehler,
# sondern ein STILLER Fallback: der Benutzer-Home-Ordner (2.4G, SSH-Key,
# Dotfiles, Configs - alles) wurde stattdessen unbemerkt direkt auf dem
# Root-Dataset angelegt, das separate Home-Dataset blieb leer.
#
# Endgueltige Root-Ursache (per /proc/self/mountinfo verifiziert, siehe
# ausfuehrlicher Kommentar in scripts/00-disk-and-base-install.sh): "zfs
# mount" fuer das Home-Dataset lief mal zu einem Zeitpunkt, an dem der
# Root-Dataset noch NICHT unter /mnt gemountet war - der Home-Mount haengt
# sich dann an den damaligen Pfad /mnt (ein simples Verzeichnis auf dem
# Live-System), nicht an den spaeter dort gemounteten Root-Dataset-Mount.
# Ergebnis: als GESCHWISTER- statt KIND-Mount im Kernel-Mount-Baum haengen
# geblieben - vom Live-System aus unter /mnt/home weiterhin ganz normal
# erreichbar (deshalb taeuschend unauffaellig), aber von INNERHALB eines
# chroot(/mnt) aus (wie Ansibles "chroot"-Connection-Plugin es macht)
# komplett unsichtbar.
#
# "mountpoint" ist dafuer KEIN verlaesslicher Pruef-Befehl: ZFS vergibt
# Datasets aus demselben Pool teils dieselbe Geraetenummer (st_dev) wie
# ihr Eltern-Dataset - "mountpoint"s klassischer st_dev-Vergleich zwischen
# Pfad und Elternverzeichnis liefert dafuer live nachweislich falsche
# Ergebnisse. "findmnt" liest stattdessen die echte Kernel-Mount-Tabelle
# (/proc/self/mountinfo) und ist davon nicht betroffen.
#
# scripts/00-disk-and-base-install.sh macht denselben Fix schon auf dem
# Live-System, unmittelbar bevor dieser Ansible-Lauf startet - hier nur
# noch als letzte Absicherung. Fix nur bei tatsaechlichem Bedarf (per
# Mount-ID-Vergleich in /proc/self/mountinfo), NICHT unbedingt: ein
# bereits korrekt verschachtelter Home-Mount darf nicht anlasslos aus-
# und wieder eingehaengt werden - live erlebt, dass ein erzwungenes
# Aushaengen aus einem voellig anderen, harmlosen Grund fehlschlagen kann
# (z.B. kurz "busy"), und das anschliessende Pflicht-Neu-Mounten dann mit
# "already mounted" abbricht, obwohl vorher alles in Ordnung war. "zfs"
# kann dafuer nicht IM Ziel-Chroot laufen (das hat an diesem fruehen
# Punkt noch kein zfs-utils installiert, kommt erst aus roles/packages -
# "No such file or directory" live so gesehen) - "delegate_to: localhost"
# fuehrt den Befehl stattdessen auf dem Ansible-Controller aus, also dem
# Live-System selbst, das zfs garantiert bootstrapped hat.
- name: /home auf dem Live-System (Ansible-Controller) korrekt (neu) mounten, falls noetig
  ansible.builtin.shell: |
    set -e
    root_id="$(awk '$5=="/mnt"{print $1; exit}' /proc/self/mountinfo)"
    home_parent_id="$(awk '$5=="/mnt/home"{print $2; exit}' /proc/self/mountinfo)"
    if [ "$home_parent_id" != "$root_id" ]; then
        mountpoint -q /mnt || zfs mount {{ root_dataset }}
        zfs unmount -f {{ home_dataset }} 2>/dev/null || true
        zfs mount {{ home_dataset }}
    fi
  delegate_to: localhost

- name: Sicherstellen, dass /home jetzt korrekt im Mount-Baum haengt
  ansible.builtin.command: findmnt /home
  changed_when: false

- name: Hostname setzen
  ansible.builtin.copy:
    dest: /etc/hostname
    content: "{{ system_hostname }}\n"
    owner: root
    group: root
    mode: "0644"

- name: /etc/hosts
  ansible.builtin.copy:
    dest: /etc/hosts
    content: |
      127.0.0.1   localhost
      ::1         localhost
      127.0.1.1   {{ system_hostname }}.localdomain {{ system_hostname }}
    owner: root
    group: root
    mode: "0644"

- name: Zeitzone setzen
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ system_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Hardware-Uhr synchronisieren
  ansible.builtin.command: hwclock --systohc
  changed_when: false
  failed_when: false

- name: locale.gen - {{ system_locale }} aktivieren
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: "^#?{{ system_locale | regex_escape }} UTF-8"
    line: "{{ system_locale }} UTF-8"

- name: locale-gen ausfuehren
  ansible.builtin.command: locale-gen
  register: _locale_gen
  changed_when: "'done' in _locale_gen.stdout or _locale_gen.rc == 0"

- name: /etc/locale.conf
  ansible.builtin.copy:
    dest: /etc/locale.conf
    content: "LANG={{ system_locale }}\n"
    owner: root
    group: root
    mode: "0644"

- name: /etc/vconsole.conf (Konsolen-Keymap)
  ansible.builtin.copy:
    dest: /etc/vconsole.conf
    content: "KEYMAP={{ console_keymap }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Sekundaergruppen des Users vorab sicherstellen (Pakete, die sie sonst anlegen wuerden, kommen erst in roles/packages)
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ restore_user_groups }}"
  when: item != 'wheel'

- name: Benutzer {{ restore_user }} anlegen
  ansible.builtin.user:
    name: "{{ restore_user }}"
    uid: "{{ restore_user_uid }}"
    groups: "{{ restore_user_groups }}"
    append: true
    shell: /bin/bash
    create_home: true
    password: "{{ vault_user_password_hash | default(omit) }}"

- name: Root-Passwort setzen (falls in vault.yml hinterlegt)
  ansible.builtin.user:
    name: root
    password: "{{ vault_root_password_hash }}"
  when: vault_root_password_hash is defined and vault_root_password_hash | length > 0

- name: wheel darf sudo (Passwort erforderlich, kein NOPASSWD)
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: "^#?\\s*%wheel ALL=\\(ALL:ALL\\) ALL"
    line: "%wheel ALL=(ALL:ALL) ALL"
    validate: "visudo -cf %s"

- name: NetworkManager-Dienste aktivieren
  # NetworkManager selbst ist schon aus dem Minimalsystem (Stufe 0
  # pacstrap) da. zfs-*/bluetooth-Services dagegen erst NACH roles/packages
  # verfuegbar (zfs-utils/bluez werden dort installiert) - deren
  # Aktivierung steht deshalb am Ende von roles/packages, nicht hier.
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  loop:
    - NetworkManager.service
    - NetworkManager-dispatcher.service
    - NetworkManager-wait-online.service
