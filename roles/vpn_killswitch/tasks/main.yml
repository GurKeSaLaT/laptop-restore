---
- name: /etc/openvpn/client anlegen (ProtectHome=true im Service - Zugangsdaten duerfen nicht unter /home liegen)
  ansible.builtin.file:
    path: /etc/openvpn/client
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: OpenVPN-Client-Config deployen
  ansible.builtin.template:
    src: normal-1194-udp.conf.j2
    dest: "/etc/openvpn/client/{{ vpn_connection_name }}.conf"
    owner: root
    group: root
    mode: "0640"

- name: OpenVPN-Zugangsdaten deployen
  ansible.builtin.template:
    src: normal-1194-udp.auth.j2
    dest: "/etc/openvpn/client/{{ vpn_connection_name }}.auth"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: up/down-Hooks deployen
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/openvpn/client/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - vpnks-up.sh
    - vpnks-down.sh

- name: vpn-killswitch-apply deployen (Template - enthaelt vault_vpn_server_host)
  ansible.builtin.template:
    src: vpn-killswitch-apply.j2
    dest: /usr/local/sbin/vpn-killswitch-apply
    owner: root
    group: root
    mode: "0755"

- name: Weitere Kill-Switch-Skripte nach /usr/local/sbin deployen
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - vpn-killswitch-enable
    - vpn-killswitch-disable
    - vpn-killswitch-resume-worker

- name: systemd-sleep Resume-Hook deployen (MUSS unter /usr/lib liegen, nicht /etc)
  ansible.builtin.copy:
    src: vpn-killswitch-resume
    dest: /usr/lib/systemd/system-sleep/vpn-killswitch-resume
    owner: root
    group: root
    mode: "0755"

- name: Kill-Switch systemd-Units deployen
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - vpn-killswitch-boot.service
    - vpn-killswitch.service
    - vpn-killswitch.timer
  notify: systemd daemon-reload

- name: Drop-in-Verzeichnis fuer openvpn-client@{{ vpn_connection_name }} anlegen
  ansible.builtin.file:
    path: "/etc/systemd/system/openvpn-client@{{ vpn_connection_name }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: openvpn-client Restart/Capabilities-Override deployen
  ansible.builtin.copy:
    src: openvpn-override.conf
    dest: "/etc/systemd/system/openvpn-client@{{ vpn_connection_name }}.service.d/override.conf"
    owner: root
    group: root
    mode: "0644"
  notify: systemd daemon-reload

- name: Boot-Fail-Safe nftables-Baseline deployen
  ansible.builtin.copy:
    src: vpnks-boot.nft
    dest: /etc/vpnks-boot.nft
    owner: root
    group: root
    mode: "0644"

- name: NetworkManager-Dispatcher-Hook deployen
  ansible.builtin.copy:
    src: 90-vpn-killswitch
    dest: /etc/NetworkManager/dispatcher.d/90-vpn-killswitch
    owner: root
    group: root
    mode: "0755"

- name: Kill-Switch-Boot-Service + Timer aktivieren
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  loop:
    - vpn-killswitch-boot.service
    - vpn-killswitch.timer

- name: openvpn-client-Service NICHT dauerhaft aktivieren (Start/Stop macht der Kill-Switch)
  ansible.builtin.systemd_service:
    name: "openvpn-client@{{ vpn_connection_name }}.service"
    enabled: false

# Eigene Ergaenzung des Nutzers, unabhaengig vom dots-hyprland-Installer:
# ~/.config/quickshell/vpn-status/patch-bar.sh (per roles/user_config
# deployed, siehe roles/user_config/files/.config/quickshell/vpn-status/)
# patcht ein VPN-Kill-Switch-Statussymbol in BarContent.qml - diese Datei
# wird bei jedem dots-hyprland-Installer-Lauf durch den Sync von
# dots/.config/quickshell ueberschrieben. Eine systemd --user Path-Unit
# (ebenfalls per roles/user_config deployed) beobachtet BarContent.qml
# und wendet den Patch automatisch erneut an, sobald sich die Datei
# aendert - so uebersteht die Anpassung jeden Reinstall/Update.
#
# Die Unit-DATEIEN liegen zwar schon unter ~/.config/systemd/user/, sind
# damit aber noch nicht AKTIV: das entspricht "systemctl --user enable",
# was aber eine laufende --user-systemd-Instanz braucht (im Chroot nicht
# vorhanden) - der Symlink unter default.target.wants/ ist das, was
# "enable" tatsaechlich anlegt, und funktioniert auch rein dateibasiert.
- name: default.target.wants/-Verzeichnis fuer {{ restore_user }} sicherstellen
  # Live gefunden: ohne dieses Verzeichnis schlaegt der Symlink-Task
  # unten mit "src file does not exist" fehl - Ansibles "file"-Modul
  # prueft die Existenz des (relativen) "src" ueber den LITERALEN Pfad
  # "<dest-Verzeichnis>/../vpn-status-bar-patch.path", nicht ueber den
  # aufgeloesten Zielpfad. Fehlt "default.target.wants/" als Verzeichnis,
  # kann das Betriebssystem den ".."-Schritt nicht durchlaufen, obwohl
  # die eigentliche Zieldatei (vpn-status-bar-patch.path, direkt
  # daneben) laengst existiert.
  ansible.builtin.file:
    path: "/home/{{ restore_user }}/.config/systemd/user/default.target.wants"
    state: directory
    owner: "{{ restore_user }}"
    group: "{{ restore_user }}"

- name: VPN-Kill-Switch-Statussymbol-Patch (Bar-Icon) fuer {{ restore_user }} aktivieren
  ansible.builtin.file:
    src: ../vpn-status-bar-patch.path
    dest: "/home/{{ restore_user }}/.config/systemd/user/default.target.wants/vpn-status-bar-patch.path"
    state: link
    owner: "{{ restore_user }}"
    group: "{{ restore_user }}"

# Nur Referenz-Zugangsdaten fuer VPN-Verbindungen, die auf ANDEREN
# Geraeten genutzt werden, nicht auf diesem Laptop - deshalb keine
# eigene OpenVPN-Config/-Funktionalitaet dazu, nur die Dateien 1:1
# wiederherstellen (wie auf dem Referenzsystem, unter ~/.config statt
# /etc/openvpn/client - daher auch keine ProtectHome-Problematik wie
# beim oben deployten Haupt-VPN).
- name: ~/.config/openvpn/ fuer {{ restore_user }} sicherstellen
  # roles/user_config deployt ~/.config/openvpn/ NIE (die echten
  # Original-Dateien wurden bewusst nicht per capture-config.sh erfasst,
  # siehe Kommentar oben zu vault_vpn_bridge_nb/-rpi) - das Verzeichnis
  # existiert also sonst nirgends. "ansible.builtin.copy" mit "content:"
  # legt fehlende Zielverzeichnisse (anders als bei "src:" auf eine
  # vorhandene Quelldatei) nicht automatisch an - live so gescheitert
  # ("Destination directory ... does not exist").
  ansible.builtin.file:
    path: "/home/{{ restore_user }}/.config/openvpn"
    state: directory
    owner: "{{ restore_user }}"
    group: "{{ restore_user }}"

- name: Referenz-Zugangsdaten fuer weitere VPN-Verbindungen (andere Geraete) deployen
  # Bewusst optional (default('') + when) statt vorausgesetzt - nicht
  # jeder, der dieses (oeffentliche) Repo als Vorlage nutzt, hat exakt
  # diese beiden persoenlichen VPN-Referenzeintraege im eigenen Vault.
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "/home/{{ restore_user }}/.config/openvpn/{{ item.name }}"
    owner: "{{ restore_user }}"
    group: "{{ restore_user }}"
    mode: "0600"
  loop:
    - {name: bridge_nb, content: "{{ vault_vpn_bridge_nb | default('') }}"}
    - {name: bridge_rpi, content: "{{ vault_vpn_bridge_rpi | default('') }}"}
  when: item.content | length > 0
  no_log: true

# Live auf dem echten Boot-Test (nicht nur im Chroot) gefunden: die
# ".path"-Unit oben (vpn-status-bar-patch.path) reagiert NUR auf
# KUENFTIGE Aenderungen an BarContent.qml (PathModified=) - bei einem
# frischen Restore wird die Datei genau einmal von roles/dotfiles
# (./setup install) geschrieben und danach nicht mehr veraendert, bis
# irgendwann ein spaeteres dots-hyprland-Update sie ueberschreibt. Die
# Path-Unit loest also NIE von selbst aus, das Icon fehlte auf dem
# ersten echten Boot komplett (manuell per SSH nachgeprueft: "systemctl
# --user status vpn-status-bar-patch.service" -> "inactive (dead)",
# kein VPN-Marker in BarContent.qml). Deshalb hier zusaetzlich einmalig
# direkt ausfuehren, statt mich auf das kuenftige "on change" der
# systemd-Units zu verlassen - die Units bleiben trotzdem bestehen,
# damit spaetere dots-hyprland-Updates den Patch automatisch erneut
# anwenden.
- name: VPN-Kill-Switch-Statussymbol-Patch einmalig direkt anwenden (Path-Unit greift erst bei kuenftigen Aenderungen)
  become: true
  become_user: "{{ restore_user }}"
  ansible.builtin.command: bash "/home/{{ restore_user }}/.config/quickshell/vpn-status/patch-bar.sh"
  changed_when: true
