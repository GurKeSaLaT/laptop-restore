---
- name: end-4/dots-hyprland klonen
  become: true
  become_user: "{{ restore_user }}"
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_dest }}"
    version: main

- name: dots-hyprland Setup mit temporaerem NOPASSWD durchfuehren
  # block/always statt einzelner Tasks: das NOPASSWD MUSS auch dann wieder
  # entfernt werden, wenn ./setup install fehlschlaegt (kein
  # failed_when: false mehr, siehe unten) - sonst wuerde ein einzelner
  # Ansible-Task-Fehler die Play sofort abbrechen und das temporaere
  # NOPASSWD dauerhaft offen stehen lassen.
  block:
    # ./setup install ruft intern "sudo_init_keepalive" auf (haelt waehrend
    # des gesamten Laufs eine sudo-Sitzung offen) - ohne TTY kann sudo
    # dafuer nicht interaktiv nach dem Passwort fragen ("a terminal is
    # required to read the password"), live so gescheitert. Gleiches
    # Muster wie beim AUR-Bootstrap in roles/packages.
    - name: Temporaeres NOPASSWD fuer dots-hyprland-Setup
      ansible.builtin.copy:
        dest: /etc/sudoers.d/99-ansible-dotfiles-setup
        content: "{{ restore_user }} ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    # ./setup install ist ausserdem grundsaetzlich interaktiv (Begruessung,
    # Rueckfragen), hat dafuer aber ein dokumentiertes "-f/--force" ("Force
    # mode without any confirm"): jede einzelne Abfrage im Skript ist
    # konsequent mit "case $ask in false) ...; *) read ...; esac"
    # abgesichert, -f setzt ask=false und ueberspringt sie alle sauber (im
    # Quellcode verifiziert, nicht geraten). "-s/--skip-sysupdate"
    # verhindert ein redundantes "sudo pacman -Syu" - roles/packages hat
    # das System bereits aktuell gehalten.
    #
    # Bewusst KEIN failed_when: false: -f/-s deckt die bekannte, rein
    # interaktivitaetsbedingte Fehlerursache ab - schlaegt der Befehl
    # trotzdem fehl, ist das ein echtes Problem (fehlende Abhaengigkeit,
    # kaputtes PKGBUILD etc.) und soll den Lauf wie jede andere Rolle auch
    # sauber abbrechen, statt es nur als leicht zu uebersehende Warnung
    # durchzuwinken.
    - name: dots-hyprland Setup ausfuehren (./setup install -f -s)
      become: true
      become_user: "{{ restore_user }}"
      # ansible.builtin.command/shell geben ihre Ausgabe grundsaetzlich
      # erst nach Abschluss des Befehls zurueck (siehe Kommentar in
      # scripts/00-disk-and-base-install.sh) - fuer einen Befehl, der
      # mehrere Minuten laufen kann, deshalb zusaetzlich per tee live in
      # eine Datei spiegeln. Aus einer zweiten SSH-Session waehrenddessen
      # mitlesbar: tail -f /mnt/tmp/dots-hyprland-setup.log
      #
      # "yes e |" davor: dots-hyprlands eigene Fehlerbehandlung (Funktion
      # x() in sdata/lib/functions.sh) fragt bei JEDEM fehlgeschlagenen
      # Befehl "Repeat/exit/ignore [R/e/i]" - OHNE $ask-Absicherung, -f
      # deckt das also NICHT ab. Ohne TTY liest das sofort EOF, Default
      # ist "R" (repeat) -> live als endlose Wiederholungsschleife
      # beobachtet (stundenlang haengend, kein Fortschritt). "yes e"
      # beantwortet jede solche Rueckfrage automatisch mit "e" (exit) -
      # ein echter Fehler bricht dann sofort sauber ab, statt endlos zu
      # wiederholen.
      #
      # ${PIPESTATUS[1]} statt pipefail: "yes" stirbt per SIGPIPE (non-zero
      # exit) sobald ./setup install durch ist, auch bei Erfolg - pipefail
      # wuerde das faelschlich als Fehlschlag werten. PIPESTATUS[1] greift
      # gezielt den Exitcode von "./setup install" selbst heraus (Position
      # 1 in der Pipe: yes=0, setup=1, tee=2), unabhaengig von yes/tee.
      ansible.builtin.shell:
        cmd: >-
          yes e | ./setup install -f -s 2>&1 | tee /tmp/dots-hyprland-setup.log;
          exit ${PIPESTATUS[1]}
        chdir: "{{ dotfiles_dest }}"
        executable: /bin/bash
      changed_when: true
  always:
    - name: Temporaeres dots-hyprland-Setup-NOPASSWD wieder entfernen
      ansible.builtin.file:
        path: /etc/sudoers.d/99-ansible-dotfiles-setup
        state: absent
