---
- name: end-4/dots-hyprland klonen
  become: true
  become_user: "{{ restore_user }}"
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_dest }}"
    version: main

# ./setup install ist grundsaetzlich interaktiv (Begruessung, Rueckfragen),
# hat dafuer aber ein dokumentiertes "-f/--force" ("Force mode without any
# confirm"): jede einzelne Abfrage im Skript ist konsequent mit
# "case $ask in false) ...; *) read ...; esac" abgesichert, -f setzt
# ask=false und ueberspringt sie alle sauber (im Quellcode verifiziert,
# nicht geraten). "-s/--skip-sysupdate" verhindert ein redundantes
# "sudo pacman -Syu" innerhalb des Skripts - roles/packages hat das System
# bereits aktuell gehalten.
- name: dots-hyprland Setup ausfuehren (./setup install -f -s)
  become: true
  become_user: "{{ restore_user }}"
  ansible.builtin.command:
    cmd: ./setup install -f -s
    chdir: "{{ dotfiles_dest }}"
  changed_when: true
  register: _dotfiles_setup
  failed_when: false

- name: Warnung falls ./setup install trotzdem fehlschlug
  ansible.builtin.debug:
    msg: >-
      ./setup install -f -s ist mit Exit {{ _dotfiles_setup.rc }}
      fehlgeschlagen. Manuell nachholen:
      su - {{ restore_user }} -c 'cd {{ dotfiles_dest }} && ./setup install'
      (ohne -f, um die genaue Fehlermeldung interaktiv zu sehen)
  when: _dotfiles_setup.rc is defined and _dotfiles_setup.rc != 0
