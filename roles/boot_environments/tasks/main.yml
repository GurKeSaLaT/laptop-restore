---
- name: Eigene Skripte nach /usr/local/bin deployen
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - zbe-rotate
    - safe-update
    - update-dotfiles

- name: zectl pacmanhook-Property aktivieren
  ansible.builtin.command: zectl set pacmanhook=yes
  changed_when: true

- name: zectl pacmanhook-prunecount setzen
  ansible.builtin.command: "zectl set pacmanhook-prunecount={{ zbm_prunecount }}"
  changed_when: true
