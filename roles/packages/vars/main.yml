---
# Erhoben auf dem Referenzsystem am 2026-09-09 via:
#   pacman -Qqe   (explizit installiert)
#   pacman -Qqm   (foreign/AUR - nicht in offiziellen Repos)
# pacman_packages = explizit MINUS foreign. aur_packages = foreign
# (ohne paru/paru-debug, die per Bootstrap-Task separat gebaut werden).

# CPU-Microcode (intel-ucode/amd-ucode) und GPU-Vulkan-Treiber
# (vulkan-intel/-radeon, lib32-Pendants) stehen bewusst NICHT hier -
# die haengen von der tatsaechlichen Zielhardware ab und werden von
# roles/hardware erkannt (ucode_pkg/gpu_packages), nicht hart hier
# eingetragen. Macht das Playbook hardwareunabhaengig nutzbar.
pacman_packages:
  - aircrack-ng
  - docker
  - dosfstools
  - efibootmgr
  - firefox
  - git
  - hashcat
  - hcxdumptool
  - hcxtools
  - less
  - linux-firmware
  - "{{ kernel_pkg }}"
  - "{{ kernel_headers_pkg }}"
  - man-db
  - man-pages
  - mtools
  - networkmanager-openvpn
  - plasma-browser-integration
  - rpi-imager
  - rust
  - steam
  - strace
  - tree
  - unzip
  - vim
  - wavemon
  - wireshark-qt
  - zip

# Reihenfolge bewusst so belassen, wie auf dem Referenzsystem vorgefunden.
#
# NICHT hier (bewusst entfernt gegenueber der reinen pacman -Qqm-Erhebung):
# - Alle "illogical-impulse-*" Pakete: das sind KEINE echten AUR-Pakete -
#   AUR-RPC-Suche findet sie nicht, weil sie nie dort veroeffentlicht wurden.
#   Es sind lokale PKGBUILD-Verzeichnisse IM end-4/dots-hyprland-Repo selbst
#   (sdata/dist-arch/illogical-impulse-*/), die dessen eigenes
#   "./setup install" (-> install-deps.sh) lokal baut. roles/dotfiles ruft
#   das bereits auf (und laeuft nach dieser Rolle) - "paru -S
#   illogical-impulse-*" haette hier nie funktionieren koennen, live mit
#   "could not find all required packages" bestaetigt.
# - "*-debug"-Pakete (html2markdown-debug, yay-bin-debug, ...): das sind
#   automatisch erzeugte Debug-Symbol-Splitpakete, die nur als Nebenprodukt
#   beim Bauen des zugehoerigen Hauptpakets entstehen (siehe paru/paru-debug
#   oben) - nie eigenstaendig aus dem AUR installierbar.
# - "python-pkg_resources": auf dem AUR nicht (mehr) auffindbar, vermutlich
#   upstream in setuptools aufgegangen - nicht essenziell.
aur_packages:
  - adw-gtk-theme-git
  - breeze-plus
  - darkly-bin
  - etcher-bin
  - html2markdown
  - kirigami2
  - litehtml0.9
  - nm-sidebar
  - otf-space-grotesk
  - qt6-avif-image-plugin
  - ttf-material-symbols-variable-git
  - ttf-readex-pro
  - ttf-rubik-vf
  - ttf-twemoji
  - vpnfailsafe-git
  - wlogout
  - yay-bin
  - zectl
  - zectl-pacman-hook
  # Nicht aus offiziellen Repos installierbar (siehe scripts/00-disk-and-base-install.sh) -
  # werden hier via AUR/dkms gebaut, brauchen nur base-devel + linux-lts-headers (schon pacstrap-t).
  - zfs-dkms
  - zfs-utils
  # Fuer roles/zfsbootmenu (generate-zbm) - auf dem Referenzsystem aktuell
  # NICHT installiert (nur die fertigen EFI-Images liegen noch da), aber
  # noetig, um sie hier neu zu erzeugen.
  - zfsbootmenu

fish_package: fish
