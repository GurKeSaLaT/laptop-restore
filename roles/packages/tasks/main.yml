---
- name: multilib-Repo aktivieren (fuer lib32-*-GPU-Treiber)
  ansible.builtin.blockinfile:
    path: /etc/pacman.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK (multilib)"
    block: |
      [multilib]
      Include = /etc/pacman.d/mirrorlist

- name: Paketdatenbank aktualisieren
  community.general.pacman:
    update_cache: true

- name: Pakete aus offiziellen Repos installieren
  community.general.pacman:
    name: "{{ pacman_packages + [fish_package] + gpu_packages + ([ucode_pkg] if ucode_pkg else []) }}"
    state: present

- name: paru-Bootstrap + AUR-Pakete mit temporaerem NOPASSWD durchfuehren
  # block/always statt einzelner Tasks: das NOPASSWD MUSS auch bei einem
  # fehlschlagenden AUR-Build wieder entfernt werden - sonst wuerde ein
  # Ansible-Task-Fehler die Play sofort abbrechen und das temporaere
  # NOPASSWD dauerhaft offen stehen lassen.
  block:
    - name: Temporaeres NOPASSWD fuer AUR-Builds
      ansible.builtin.copy:
        dest: /etc/sudoers.d/99-ansible-aur-build
        content: "{{ restore_user }} ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Pruefen ob paru schon installiert ist
      ansible.builtin.stat:
        path: /usr/bin/paru
      register: _paru_bin

    - name: paru aus AUR bauen (Bootstrap, sonst kein AUR-Helper verfuegbar)
      # paru-bin (vorkompiliertes Paket) wurde hier testweise verwendet, um
      # das OOM beim Quell-Build zu umgehen - live aber an einem
      # ABI-Mismatch gescheitert ("libalpm.so.15: cannot open shared
      # object file"), weil paru-bin gegen eine andere libalpm-Version
      # gebaut ist als tatsaechlich installiert (Rolling-Release, Version
      # kann jederzeit abweichen). Ein Quell-Build linkt dagegen immer
      # exakt gegen die installierte libalpm. Das eigentliche OOM-Problem
      # war die 4G-RAM-Test-VM (behoben durch mehr RAM) -
      # CARGO_BUILD_JOBS=1 bleibt trotzdem als Sicherheitsmarge fuer
      # schwaechere Zielhardware.
      when: not _paru_bin.stat.exists
      block:
        - name: AUR-Quelle von paru klonen
          become: true
          become_user: "{{ restore_user }}"
          ansible.builtin.git:
            repo: https://aur.archlinux.org/paru.git
            dest: "/home/{{ restore_user }}/.cache/aur-build/paru"

        - name: paru bauen und installieren
          become: true
          become_user: "{{ restore_user }}"
          environment:
            CARGO_BUILD_JOBS: "1"
          # Live per tee nach /tmp/paru-build.log gespiegelt (mehrere
          # Minuten Laufzeit, siehe roles/dotfiles fuer die ausfuehrliche
          # Begruendung) - aus einer zweiten SSH-Session mitlesbar:
          # tail -f /mnt/tmp/paru-build.log
          ansible.builtin.shell:
            cmd: "set -o pipefail; makepkg -si --noconfirm --needed 2>&1 | tee /tmp/paru-build.log"
            chdir: "/home/{{ restore_user }}/.cache/aur-build/paru"
            creates: /usr/bin/paru
            executable: /bin/bash

    - name: AUR-Pakete via paru installieren
      become: true
      become_user: "{{ restore_user }}"
      # Live per tee nach /tmp/aur-packages-install.log gespiegelt (kann
      # bei vielen Paketen/AUR-Builds lange laufen) - aus einer zweiten
      # SSH-Session mitlesbar: tail -f /mnt/tmp/aur-packages-install.log
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          paru -S --noconfirm --needed {{ aur_packages | join(' ') }}
          2>&1 | tee /tmp/aur-packages-install.log
        executable: /bin/bash
      register: _paru_install
      changed_when: "'there is nothing to do' not in _paru_install.stdout | lower"
  always:
    - name: Temporaeres AUR-Build-NOPASSWD wieder entfernen
      ansible.builtin.file:
        path: /etc/sudoers.d/99-ansible-aur-build
        state: absent

- name: ZFS-Systemdienste aktivieren (zfs-utils erst hier oben installiert)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  loop:
    - zfs-import-cache.service
    - zfs-mount.service
    - zfs-import.target
    - zfs.target
    - zfs-zed.service

- name: Bluetooth-Dienst aktivieren, falls ein Paket ihn mitgebracht hat
  # bluez kommt indirekt als Abhaengigkeit eines der obigen Pakete (kein
  # fest eingetragener Top-Level-Package) - best-effort, kein Show-Stopper
  # falls doch mal nicht vorhanden.
  ansible.builtin.systemd_service:
    name: bluetooth.service
    enabled: true
  failed_when: false
