# Workaround for kernel hard lockups in btusb_work -> usb_set_interface ->
# xhci_urb_dequeue (Intel 8087:0a2b BT, linux-lts 6.18). Every A2DP<->HFP
# switch reconfigures the SCO alt setting and can freeze the whole system.
# So: never auto-switch, keep the Sony WF-1000XM4 / WF-1000XM5 permanently in HFP (mSBC).

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

device.profile.priority.rules = [
  {
    matches = [
      { device.name = "bluez_card.88_C9_E8_CB_97_99" }
      { device.name = "bluez_card.F8_4E_17_D3_88_49" }
    ]
    actions = {
      update-props = {
        priorities = [ "headset-head-unit", "headset-head-unit-cvsd" ]
      }
    }
  }
]
