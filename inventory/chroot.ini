# Ziel ist kein Netzwerk-Host, sondern das frisch pacstrap-te System unter
# /mnt. Ansibles "chroot"-Connection-Plugin führt Module direkt per
# chroot(2) dort aus - kein SSH, kein Passwort nötig, läuft als root
# (muss es auch: chroot selbst erfordert root).
target ansible_connection=chroot ansible_host=/mnt ansible_python_interpreter=/usr/bin/python3

[restore]
target
